<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; script-src 'self'">
    <title>Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
                <span>Oder benutze deinen E-Mail um dich zu registrieren</span>
                <input type="text" placeholder="Name">
                <input type="email" placeholder="E-mail">
                <input type="password" placeholder="Password">
                <button type="button">Konto erstellen</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form>
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
                <span>Oder benutze deinen E-Mail, um dich einzuloggen</span>
                <input type="email" placeholder="E-Mail">
                <input type="password" placeholder="Password">
                <a href="#">Passwort Vergessen?</a>
                <button type="button">Anmelden</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-pannel toggle-left">
                    <h1>Hallo, Freund!</h1>
                    <p>Bitte gib deine Daten ein, um ein Konto zu erstellen!</p>
                    <h3>Oder</h3>
                    <button type="button" class="hidden" id="login">Anmelden</button>
                </div>
                <div class="toggle-pannel toggle-right">
                    <h1>Willkommen Zurück!</h1>
                    <p>Bitte gib deine Daten ein, um dich einzuloggen!</p>
                    <h3>Oder</h3>
                    <button type="button" class="hidden" id="register">Konto erstellen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
